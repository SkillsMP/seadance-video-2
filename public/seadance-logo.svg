<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Circle (optional, let's keep it clean/transparent) -->
  
  <!-- The Wave-Play Shape -->
  <!-- A fluid shape that resembles a play button (triangle) but made of waves -->
  <g transform="translate(40, 40) scale(0.85)">
    <!-- Main Body: Fluid Wave Triangle -->
    <path d="M120 80 
             C 120 80, 420 256, 420 256 
             C 420 256, 120 432, 120 432 
             C 120 432, 180 256, 120 80 Z" 
          fill="url(#oceanGradient)" 
          filter="url(#glow)" />
          
    <!-- Inner Wave Accent to suggest 'Dance' -->
    <path d="M140 130 
             Q 200 256 140 380 
             Q 240 256 140 130" 
          fill="#ffffff" 
          opacity="0.4" />
          
    <!-- Another flowing line -->
    <path d="M220 190 
             Q 260 256 220 320 
             Q 280 256 220 190" 
          fill="#ffffff" 
          opacity="0.3" />
  </g>
</svg>
